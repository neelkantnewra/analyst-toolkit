<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quantile Bucket Builder</title>
<style>
  :root{
    --bg:#f7f7f5; --card:#ffffff; --ink:#1f1f1d; --sub:#6b6b64;
    --accent:#b5651d; --accent2:#8a4a12; --line:#e4e2dc; --mono-bg:#1f1f1d; --mono-ink:#eae7df;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161614; --card:#201f1c; --ink:#f0eee8; --sub:#a8a49a;
      --accent:#e0995a; --accent2:#f2b385; --line:#3a3834; --mono-bg:#0d0d0c; --mono-ink:#e6e2d8;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161614; --card:#201f1c; --ink:#f0eee8; --sub:#a8a49a;
    --accent:#e0995a; --accent2:#f2b385; --line:#3a3834; --mono-bg:#0d0d0c; --mono-ink:#e6e2d8;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px) 0;
  }
  .wrap{max-width:920px;margin:0 auto;padding:32px 20px 60px;}
  h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-0.01em;}
  .lede{color:var(--sub);font-size:0.92rem;margin:0 0 24px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px;}
  label{display:block;font-size:0.82rem;font-weight:600;color:var(--sub);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.03em;}
  textarea,input[type=text],input[type=number]{
    width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:10px 12px;font-size:0.95rem;font-family:inherit;
  }
  textarea{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:0.85rem;}
  .row{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;}
  .row > div{flex:1 1 160px;}
  .checks{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px;}
  .check{display:flex;align-items:center;gap:8px;font-size:0.9rem;}
  .check input{width:16px;height:16px;}
  .check label{margin:0;text-transform:none;font-weight:500;color:var(--ink);}
  .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px;width:fit-content;}
  .seg label{margin:0;text-transform:none;font-weight:500;padding:8px 14px;cursor:pointer;color:var(--sub);font-size:0.88rem;}
  .seg input{display:none;}
  .seg input:checked + label{background:var(--accent);color:#fff;}
  button{
    background:var(--accent);color:#fff;border:none;border-radius:8px;
    padding:12px 20px;font-size:0.95rem;font-weight:600;cursor:pointer;margin-top:18px;
  }
  button:hover{background:var(--accent2);}
  table{width:100%;border-collapse:collapse;margin-top:6px;font-size:0.88rem;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);}
  th{color:var(--sub);font-weight:600;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.02em;}
  .bar{height:6px;border-radius:3px;background:var(--accent);}
  .barbg{background:var(--line);border-radius:3px;overflow:hidden;width:100px;}
  pre{
    background:var(--mono-bg);color:var(--mono-ink);padding:16px;border-radius:10px;
    overflow-x:auto;font-size:0.85rem;line-height:1.5;white-space:pre;
  }
  .copybtn{background:transparent;border:1px solid var(--line);color:var(--sub);padding:6px 12px;
    font-size:0.8rem;font-weight:600;margin:8px 0 0;}
  .copybtn:hover{background:var(--line);color:var(--ink);}
  .muted{color:var(--sub);font-size:0.85rem;}
  .err{color:#c0392b;font-size:0.88rem;margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Quantile Bucket Builder</h1>
  <p class="lede">Paste raw values, or a value+count table straight from SQL, and get lettered population-balanced buckets plus a ready SQL CASE WHEN.</p>

  <div class="card">
    <label for="varname">Variable name</label>
    <input type="text" id="varname" value="age" style="margin-bottom:14px;">

    <label>Data format</label>
    <div class="seg">
      <input type="radio" name="mode" id="modeRaw" value="raw">
      <label for="modeRaw">Raw values</label>
      <input type="radio" name="mode" id="modePairs" value="pairs" checked>
      <label for="modePairs">Value + Count pairs</label>
    </div>

    <label for="data" id="dataLabel">Paste "value, count" per line — e.g. straight from a GROUP BY</label>
    <textarea id="data" placeholder="18  40000
19  38210
20  36788">18	40000
25	38210
30	36788
35	34500
40	31200
45	28900
50	24100
55	19800
60	15200
65	9800
70	5400
80	2100
99999	850</textarea>

    <div class="row">
      <div>
        <label for="pct">Target % per bucket</label>
        <input type="number" id="pct" value="20" min="1" max="50">
      </div>
      <div>
        <label for="round">Round edges to nearest</label>
        <input type="number" id="round" value="5" min="0">
      </div>
    </div>

    <div class="row">
      <div>
        <label for="sentinels">Treat these values as their own bucket (comma separated, e.g. sentinel/outlier codes)</label>
        <input type="text" id="sentinels" placeholder="e.g. 99999, -1, 999990" value="99999">
      </div>
    </div>

    <div class="checks">
      <div class="check"><input type="checkbox" id="openTop" checked><label for="openTop">Open-ended top bucket (e.g. "80+")</label></div>
      <div class="check"><input type="checkbox" id="openBottom" checked><label for="openBottom">Open-ended bottom bucket (e.g. "under 25")</label></div>
    </div>

    <button onclick="run()">Compute buckets</button>
    <div id="error" class="err"></div>
  </div>

  <div class="card" id="results" style="display:none;">
    <table id="table"></table>
    <p class="muted" id="note" style="margin-top:10px;"></p>
  </div>

  <div class="card" id="sqlcard" style="display:none;">
    <label>SQL CASE WHEN</label>
    <pre id="sqlout"></pre>
    <button class="copybtn" onclick="copySql()">Copy</button>
  </div>
</div>

<script>
document.querySelectorAll('input[name=mode]').forEach(r=>r.addEventListener('change', ()=>{
  const isPairs = document.getElementById('modePairs').checked;
  document.getElementById('dataLabel').textContent = isPairs
    ? 'Paste "value, count" per line — e.g. straight from a GROUP BY'
    : 'Paste raw values (comma, space, or newline separated)';
}));

// Parses input into a sorted {value, count} distribution, regardless of mode.
function parseToDistribution(raw, isPairs){
  const map = {};
  if(isPairs){
    raw.split('\n').forEach(line=>{
      const parts = line.trim().split(/[\s,]+/).filter(Boolean);
      if(parts.length < 2) return;
      const v = parseFloat(parts[0]), c = parseFloat(parts[1]);
      if(isNaN(v) || isNaN(c)) return;
      map[v] = (map[v]||0) + c;
    });
  } else {
    raw.split(/[\s,]+/).forEach(tok=>{
      const v = parseFloat(tok);
      if(isNaN(v)) return;
      map[v] = (map[v]||0) + 1;
    });
  }
  const values = Object.keys(map).map(Number).sort((a,b)=>a-b);
  return { values, counts: values.map(v=>map[v]), total: values.reduce((s,v)=>s+map[v],0) };
}
// Weighted percentile over a grouped distribution (step-function on cumulative count).
function weightedPercentile(dist, p){
  const target = (p/100) * dist.total;
  let cum = 0;
  for(let i=0;i<dist.values.length;i++){
    cum += dist.counts[i];
    if(cum >= target) return dist.values[i];
  }
  return dist.values[dist.values.length-1];
}
function countInRange(dist, lo, hi, isLast){
  let c = 0;
  for(let i=0;i<dist.values.length;i++){
    const v = dist.values[i];
    if(v >= lo && (isLast ? v <= hi : v < hi)) c += dist.counts[i];
  }
  return c;
}
function roundTo(val, step){
  if(!step) return Math.round(val*100)/100;
  return Math.round(val/step)*step;
}
function isRoundBoundary(val, step){
  if(val===0) return true;
  const s = step>0 ? step : 10;
  return Math.abs(val - Math.round(val/s)*s) < 1e-9;
}
function toLetter(n){ // 0-indexed -> A, B, ... Z, AA, AB, ...
  n++;
  let s='';
  while(n>0){ const rem=(n-1)%26; s=String.fromCharCode(65+rem)+s; n=Math.floor((n-1)/26); }
  return s;
}

// Detects a header row (e.g. "age,count" pasted straight from a GROUP BY)
// and strips it out, returning the variable name it found (if any).
function stripHeader(raw, isPairs){
  const lines = raw.split('\n');
  let idx = 0;
  while(idx < lines.length && lines[idx].trim()==='') idx++;
  if(idx >= lines.length) return { varName:null, rest:raw };
  const parts = lines[idx].trim().split(/[\s,]+/).filter(Boolean);
  let isHeaderRow = false, varName = null;
  if(isPairs && parts.length >= 2){
    if(isNaN(parseFloat(parts[0])) || isNaN(parseFloat(parts[1]))){
      isHeaderRow = true; varName = parts[0];
    }
  } else if(!isPairs && parts.length >= 1){
    if(isNaN(parseFloat(parts[0]))){ isHeaderRow = true; varName = parts[0]; }
  }
  if(!isHeaderRow) return { varName:null, rest:raw };
  return { varName, rest: lines.slice(0,idx).concat(lines.slice(idx+1)).join('\n') };
}

function run(){
  document.getElementById('error').textContent='';
  const raw = document.getElementById('data').value;
  const isPairs = document.getElementById('modePairs').checked;
  const pct = parseFloat(document.getElementById('pct').value) || 20;
  const roundStep = parseFloat(document.getElementById('round').value) || 0;
  const openTop = document.getElementById('openTop').checked;
  const openBottom = document.getElementById('openBottom').checked;
  const sentinelList = document.getElementById('sentinels').value
    .split(',').map(s=>parseFloat(s.trim())).filter(v=>!isNaN(v));

  const headerInfo = stripHeader(raw, isPairs);
  if(headerInfo.varName){
    document.getElementById('varname').value = headerInfo.varName;
  }
  const varname = document.getElementById('varname').value.trim() || 'x';

  const fullDist = parseToDistribution(headerInfo.rest, isPairs);
  if(fullDist.values.length < 2 || fullDist.total < 5){
    document.getElementById('error').textContent = 'Need at least a couple of distinct values with counts.';
    return;
  }

  // split out sentinel values into their own buckets before quantile math
  const sentinelBuckets = [];
  const keepIdx = [];
  fullDist.values.forEach((v,i)=>{
    if(sentinelList.includes(v)) sentinelBuckets.push({sentinel:v, count:fullDist.counts[i], label:`${v} (sentinel)`});
    else keepIdx.push(i);
  });
  const dist = {
    values: keepIdx.map(i=>fullDist.values[i]),
    counts: keepIdx.map(i=>fullDist.counts[i]),
    total: keepIdx.reduce((s,i)=>s+fullDist.counts[i],0)
  };
  const totalCount = fullDist.total;
  if(dist.values.length < 2){
    document.getElementById('error').textContent = 'After removing sentinel values, not enough distinct values remain.';
    return;
  }

  const nBuckets = Math.max(2, Math.round(100/pct));
  let edges = [];
  for(let i=1;i<nBuckets;i++){
    edges.push(weightedPercentile(dist, (i*100)/nBuckets));
  }
  const min = dist.values[0], max = dist.values[dist.values.length-1];
  edges = edges.map(e => roundTo(e, roundStep));
  // drop any rounded edge that lands at or outside the true data range —
  // otherwise it creates a phantom empty bucket (e.g. an edge rounding
  // down to 0 when the real minimum is 1)
  const droppedEdges = edges.filter(e => e <= min || e >= max).length;
  edges = [...new Set(edges.filter(e => e > min && e < max))].sort((a,b)=>a-b);
  const boundaries = [min, ...edges, max];

  const minIsRound = isRoundBoundary(min, roundStep);
  const maxIsRound = isRoundBoundary(max, roundStep);
  const effOpenBottom = openBottom && !minIsRound;
  const effOpenTop = openTop && !maxIsRound;

  const buckets = [];
  for(let i=0;i<boundaries.length-1;i++){
    const lo = boundaries[i], hi = boundaries[i+1];
    const isFirst = i===0, isLast = i===boundaries.length-2;
    const count = countInRange(dist, lo, hi, isLast);
    let rangeLabel;
    if(isFirst && effOpenBottom) rangeLabel = `under ${boundaries[1]}`;
    else if(isLast && effOpenTop) rangeLabel = `${lo}+`;
    else rangeLabel = `${lo}\u2013${hi}`;
    buckets.push({lo, hi, count, rangeLabel, isFirst, isLast});
  }

  // assign sequential letters: numeric buckets first, then sentinel buckets
  let li = 0;
  buckets.forEach(b => { b.letter = toLetter(li++); b.label = `${b.letter}) ${b.rangeLabel}`; });
  sentinelBuckets.forEach(b => { b.letter = toLetter(li++); b.label = `${b.letter}) ${b.sentinel} (sentinel)`; });

  let rows = `<tr><th>Bucket</th><th>Count</th><th>% of data</th><th></th></tr>`;
  [...buckets, ...sentinelBuckets].forEach(b=>{
    const p = ((b.count/totalCount)*100).toFixed(1);
    rows += `<tr><td>${b.label}</td><td>${b.count.toLocaleString()}</td><td>${p}%</td>
      <td><div class="barbg"><div class="bar" style="width:${Math.min(100,p)}%"></div></div></td></tr>`;
  });
  document.getElementById('table').innerHTML = rows;
  document.getElementById('results').style.display = 'block';

  let note = [];
  if(headerInfo.varName) note.push(`detected header row — variable name set to "${headerInfo.varName}"`);
  if(minIsRound && openBottom) note.push(`min (${min}) looks like a clean boundary — used as a fixed edge instead of "under"`);
  if(maxIsRound && openTop) note.push(`max (${max}) looks like a clean boundary — used as a fixed edge instead of "+"`);
  if(droppedEdges > 0) note.push(`${droppedEdges} rounded edge(s) landed outside the actual data range and were dropped to avoid an empty bucket — try a smaller rounding step for finer control`);
  document.getElementById('note').textContent = note.join(' · ');

  let sql = `CASE\n`;
  sentinelBuckets.forEach(b=>{
    sql += `  WHEN ${varname} = ${b.sentinel} THEN '${b.label}'\n`;
  });
  buckets.forEach(b=>{
    if(b.isFirst && effOpenBottom){
      sql += `  WHEN ${varname} < ${boundaries[1]} THEN '${b.label}'\n`;
    } else if(b.isLast && effOpenTop){
      sql += `  WHEN ${varname} >= ${b.lo} THEN '${b.label}'\n`;
    } else {
      sql += b.isLast
        ? `  WHEN ${varname} >= ${b.lo} AND ${varname} <= ${b.hi} THEN '${b.label}'\n`
        : `  WHEN ${varname} >= ${b.lo} AND ${varname} < ${b.hi} THEN '${b.label}'\n`;
    }
  });
  sql += `END AS ${varname}_bucket`;
  document.getElementById('sqlout').textContent = sql;
  document.getElementById('sqlcard').style.display = 'block';
}
function copySql(){
  navigator.clipboard.writeText(document.getElementById('sqlout').textContent).catch(()=>{});
}
</script>
</body>
</html>
